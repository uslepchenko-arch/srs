<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея нейро-картин</title>
    <link rel="stylesheet" href="./fonts/fonts.css">
    <link rel="stylesheet" href="./style.css">
    <style>
        
        .gallery__item {
            position: relative;
            list-style: none;
        }

        .like-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        
        .like-toggle {
            display: none;
        }

        
        .like-label {
            cursor: pointer;
            font-size: 24px;
            user-select: none;
            transition: transform 0.2s ease;
            display: inline-block;
        }

        .like-label:hover {
            transform: scale(1.1);
        }

      
        .like-label::before {
            content: '♡';
            color: #666;
        }

        
        .like-toggle:checked + .like-label::before {
            content: '♥';
            color: #ff4d4d;
        }

       
        .like-count {
            font-size: 16px;
            color: #666;
            min-width: 30px;
            counter-increment: none;
        }

        
        #count1 { counter-reset: likes 0; }
        #count2 { counter-reset: likes 0; }
        #count3 { counter-reset: likes 0; }
        #count4 { counter-reset: likes 0; }
        #count5 { counter-reset: likes 0; }
        #count6 { counter-reset: likes 0; }
        #count7 { counter-reset: likes 0; }
        #count8 { counter-reset: likes 0; }
        #count9 { counter-reset: likes 0; }
        #count10 { counter-reset: likes 0; }
        #count11 { counter-reset: likes 0; }
        #count12 { counter-reset: likes 0; }

        
        #like1:checked ~ #count1 { counter-increment: likes 1; }
        #like2:checked ~ #count2 { counter-increment: likes 1; }
        #like3:checked ~ #count3 { counter-increment: likes 1; }
        #like4:checked ~ #count4 { counter-increment: likes 1; }
        #like5:checked ~ #count5 { counter-increment: likes 1; }
        #like6:checked ~ #count6 { counter-increment: likes 1; }
        #like7:checked ~ #count7 { counter-increment: likes 1; }
        #like8:checked ~ #count8 { counter-increment: likes 1; }
        #like9:checked ~ #count9 { counter-increment: likes 1; }
        #like10:checked ~ #count10 { counter-increment: likes 1; }
        #like11:checked ~ #count11 { counter-increment: likes 1; }
        #like12:checked ~ #count12 { counter-increment: likes 1; }

        
        .like-count::after {
            content: counter(likes);
        }

        
        @media (max-width: 768px) {
            .like-label {
                font-size: 20px;
            }
            
            .like-count {
                font-size: 14px;
            }
        }
    </style>
</head>
